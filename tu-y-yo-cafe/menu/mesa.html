<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--esp:#1e130d;--roast:#2c1c13;--crema:#f1e8da;--oat:#e6d9c4;--latte:#c69c72;--tang:#ff6a2b;--tangd:#b4441a;--disp:"Bricolage Grotesque",system-ui,sans-serif}
@page{size:100mm 150mm;margin:0}
body{font-family:"Figtree",system-ui,sans-serif;background:#cbbba5;min-height:100vh;display:grid;place-items:center;padding:56px 16px 24px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hint{position:fixed;top:0;left:0;right:0;height:38px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--crema);color:var(--esp);font-size:12px;font-weight:600;border-bottom:1px solid rgba(30,19,13,.12)}
.hint::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tang)}
.card{position:relative;width:100mm;height:150mm;max-width:100%;background:var(--crema);color:var(--esp);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(30,19,13,.6)}
.cond{font-family:var(--disp);font-variation-settings:"wdth" 75;font-weight:800;letter-spacing:-.035em}
.top{padding:9mm 8mm 0;display:flex;justify-content:space-between;align-items:flex-start}
.name{font-size:17mm;line-height:.8}
.name span{color:var(--tang)}
.tag{font-size:3.1mm;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--tangd);margin-top:3mm}
.dropd{width:9mm;height:9mm;background:var(--tang);border-radius:50% 50% 50% 0;transform:rotate(-45deg);margin-top:2mm}
.mid{flex:1;display:grid;place-items:center;position:relative}
.ring{position:absolute;width:76mm;height:76mm}
.qr{position:relative;width:44mm;background:#fff;padding:4mm;border-radius:3mm}
.qr svg{display:block;width:100%;height:auto}
.bot{background:var(--esp);color:var(--crema);padding:6mm 8mm 7mm}
.bot .big{font-size:9.5mm;line-height:.9}
.bot .big em{font-style:normal;color:var(--tang)}
.bot p.s{font-size:3.4mm;font-weight:500;color:var(--oat);margin-top:2mm}
@media print{body{background:none;padding:0;display:block}.hint{display:none}.card{box-shadow:none}}
</style>
</head>
