<style>:root{--bg:#f1e8da;--surface:#f8f2e8;--ink:#1e130d;--muted:#6d5b4b;--line:rgba(30,19,13,.14);--hd:#1e130d;--hdink:#f1e8da;--hdmuted:#c9b8a3;--acc:#ff6a2b;--accink:#1e130d;--acc2:#c69c72;--disp:"Bricolage Grotesque",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif;--dispw:800;--disptt:none;--displs:-.03em;--dispvar:"wdth" 75;--subc:#ff6a2b}
*{box-sizing:border-box;margin:0;padding:0}
@page{size:100mm 150mm;margin:0}
body{font-family:var(--body);background:#d9d4cc;min-height:100vh;display:grid;place-items:center;padding:20px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card{width:100mm;height:150mm;background:var(--hd);color:var(--hdink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:12mm 10mm 9mm;position:relative;overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4mm;background:linear-gradient(90deg,var(--acc) 0 60%,var(--acc2) 60% 100%)}
h1{font-family:var(--disp);font-weight:var(--dispw);text-transform:var(--disptt);letter-spacing:var(--displs);font-variation-settings:var(--dispvar);font-size:13mm;line-height:.95}
.sub{font-family:var(--disp);font-weight:var(--dispw);font-variation-settings:var(--dispvar);text-transform:var(--disptt);font-size:5.5mm;color:var(--subc);margin-top:1.5mm}
.qr{background:#fff;padding:4mm;border-radius:4mm;width:62mm}
.qr svg{display:block;width:100%;height:auto}
.cta{font-size:5mm;font-weight:700;line-height:1.2}
.cta span{display:block;font-size:3.6mm;font-weight:500;color:var(--hdmuted);margin-top:1.5mm}
.hint{position:fixed;top:12px;left:0;right:0;text-align:center;font:600 13px system-ui,sans-serif;color:#3a352e}
@media print{body{background:none;padding:0;display:block}.card{box-shadow:none}.hint{display:none}}
</style>
