<meta charset="utf-8">

<title>Tarjeta para mostrador · La Herencia JD Panadería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#f7ecda;--cocoa:#2a1409;--pink:#f4a9b8;--yolk:#f3b52f;--rain:#2f58d1;--oven:#c9361b;--ink-soft:#6b4a35}
@page{size:100mm 150mm;margin:0}
body{font-family:"Figtree",system-ui,sans-serif;background:#d9c7ab;min-height:100vh;display:grid;place-items:center;padding:56px 16px 24px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hint{position:fixed;top:0;left:0;right:0;min-height:36px;display:flex;align-items:center;justify-content:center;background:var(--cocoa);color:#f3dfc2;font-size:12px;font-weight:700;letter-spacing:.03em;padding:6px 14px;text-align:center}
.card{position:relative;width:100mm;height:150mm;max-width:100%;background:var(--cream);color:var(--cocoa);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -24px rgba(42,20,9,.6)}
.top{position:relative;background:var(--cocoa);color:var(--cream);padding:6mm 7mm 5mm}
.logo{font-family:"Bagel Fat One",serif;font-size:7.4mm;line-height:1}
.logo small{display:block;font-family:"Figtree",sans-serif;font-size:2.6mm;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#dcc4a3;margin-top:1.4mm}
.band{background:var(--pink);border-block:.8mm solid var(--cocoa);display:flex;align-items:center;justify-content:center;gap:3mm;padding:2.2mm 0;font-family:"Bagel Fat One",serif;font-size:5.2mm;line-height:1;white-space:nowrap}
.band svg{width:4.6mm;height:4.6mm;color:var(--oven);flex:none}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4mm 7mm 0;position:relative}
.kicker{display:inline-flex;align-items:center;gap:2.4mm;font-size:2.9mm;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--oven)}
.kicker::before{content:"";width:5mm;height:.5mm;background:currentColor}
h1{font-family:"Bagel Fat One",serif;font-weight:400;font-size:11.5mm;line-height:.92;text-align:center;margin-top:2.4mm}
h1 span{color:var(--oven)}
.qr{position:relative;margin-top:5mm;width:58mm;padding:4mm;background:#fff;border-radius:5mm;box-shadow:0 0 0 .8mm var(--cocoa)}
.qr svg.segno{display:block;width:100%;height:auto}
.seal{position:absolute;z-index:2;right:6mm;top:5mm;width:21mm;height:21mm;border-radius:50%;background:var(--yolk);box-shadow:0 0 0 .7mm var(--cocoa);display:grid;place-items:center;transform:rotate(-12deg)}
.seal b{font-family:"Bagel Fat One",serif;font-weight:400;font-size:7mm;line-height:1}
.foot{padding:5mm 7mm 6mm;text-align:center;font-size:3.5mm;font-weight:700;color:var(--ink-soft);line-height:1.3}
.foot b{color:var(--cocoa)}
@media print{body{background:none;padding:0;display:block}.hint{display:none}.card{box-shadow:none}}
</style>
</head>
