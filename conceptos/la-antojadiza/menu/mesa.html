:root{--cobalt:#1d3a94;--deep:#0f1f4d;--night:#0a1536;--cream:#fbf4e6;--paper:#fffaf0;--chile:#c4321c;--yolk:#f4b731;--ink:#141210;--muted:#5f5647;--slab:"Alfa Slab One",Rockwell,Georgia,serif;

@page{size:100mm 150mm;margin:0}
body{font-family:"Work Sans",system-ui,sans-serif;background:#2b3557;min-height:100vh;display:grid;place-items:center;padding:56px 16px 24px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hint{position:fixed;top:0;left:0;right:0;min-height:38px;display:flex;align-items:center;justify-content:center;padding:0 12px;background:var(--night);color:#d9dff0;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.hint i{font-style:normal;color:var(--yolk);margin:0 6px}
.card{width:100mm;height:150mm;max-width:100%;background:var(--tile) 0 0/16mm 16mm;padding:6mm;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.in{height:100%;background:var(--paper);border-radius:2mm;box-shadow:0 0 0 1.2mm var(--cobalt);display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.hd{width:100%;background:var(--deep);color:#fff;padding:5mm 4mm 4mm}
.eyebrow{font-size:2.6mm;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--yolk)}
h1{font-family:var(--slab);font-weight:400;line-height:.9;font-size:10.5mm;margin-top:2mm}
h1 span{display:block;font-size:.42em;color:var(--yolk);margin-bottom:.5mm}
.qr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3mm;padding:4mm}
.qr .box{position:relative;width:46mm;padding:3.5mm;background:#fff;border:.8mm solid var(--deep);border-radius:1.5mm}
.qr svg.segno{display:block;width:100%;height:auto}
.d{position:absolute;width:4mm;height:4mm;background:var(--chile);transform:rotate(45deg)}
.d.a{left:-2.4mm;top:-2.4mm}.d.b{right:-2.4mm;top:-2.4mm}.d.c{left:-2.4mm;bottom:-2.4mm}.d.e{right:-2.4mm;bottom:-2.4mm}
.cta{font-family:var(--slab);font-weight:400;font-size:6mm;line-height:1;color:var(--deep)}
.sub{font-size:3.2mm;font-weight:500;color:var(--muted);line-height:1.3;max-width:52mm}
.band{width:100%;background:var(--chile);color:var(--cream);border-top:.8mm solid var(--ink);padding:2.6mm 3mm;display:flex;align-items:center;justify-content:center;gap:3mm;font-family:var(--slab);font-size:3.8mm}
.band i{width:2.4mm;height:2.4mm;background:var(--yolk);transform:rotate(45deg);flex:none}
@media print{body{background:none;padding:0;display:block}.hint{display:none}.card{box-shadow:none}}
@media screen and (max-width:440px){.card{zoom:.86}}@media screen and (max-width:360px){.card{zoom:.76}}
</style>
</head>
