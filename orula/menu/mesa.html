<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#120d0a;--char:#1d1611;--cream:#f6ead7;--sand:#e9d6b6;--saffron:#f2a516;--palm:#d9481f;--leaf:#2f7a4c;--disp:"Unbounded","Arial Black",sans-serif;
--kente:repeating-linear-gradient(90deg,var(--saffron) 0 34px,var(--ink) 34px 40px,var(--palm) 40px 62px,var(--ink) 62px 68px,var(--leaf) 68px 96px,var(--ink) 96px 102px,var(--saffron) 102px 110px,var(--ink) 110px 116px)}
@page{size:100mm 150mm;margin:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:#2a211b;min-height:100vh;display:grid;place-items:center;padding:56px 16px 24px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hint{position:fixed;top:0;left:0;right:0;height:38px;display:flex;align-items:center;justify-content:center;background:var(--saffron);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.04em}
.card{position:relative;width:100mm;height:150mm;max-width:100%;background:radial-gradient(120% 70% at 80% 20%,#3a1d10 0%,var(--ink) 62%);color:var(--cream);overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.k{width:100%;height:5mm;background:var(--kente);background-size:116px 100%;flex:none}
.in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7mm 9mm 6mm;width:100%}
.brand{font-family:var(--disp);font-weight:900;text-transform:uppercase;letter-spacing:-.03em;color:var(--saffron);font-size:6mm;line-height:1}
h1{font-family:var(--disp);font-weight:900;text-transform:uppercase;letter-spacing:-.04em;line-height:.84;font-size:13mm;margin-top:2mm}
h1 em{font-style:normal;color:var(--palm)}
.arch{position:relative;width:60mm;padding:9mm 6mm 6mm;background:var(--cream);border-radius:999px 999px 4mm 4mm}
.arch svg.segno{display:block;width:100%;height:auto}
.ring{position:absolute;inset:-3mm -3mm 2mm;border:.5mm solid rgba(242,165,22,.6);border-bottom:0;border-radius:999px 999px 0 0;pointer-events:none}
.sun{position:absolute;right:-7mm;top:-7mm;width:17mm;height:17mm}
.cta{font-family:var(--disp);font-weight:700;font-size:4.6mm;line-height:1.15;letter-spacing:-.01em}
.cta span{display:block;font-family:"DM Sans",sans-serif;font-weight:500;font-size:3.4mm;color:var(--sand);margin-top:1.5mm;letter-spacing:0}
@media print{body{background:none;padding:0;display:block}.hint{display:none}.card{box-shadow:none}}
</style>
</head>
