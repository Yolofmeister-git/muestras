<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#143526;--leaf:#1f5a3c;--nogada:#f4ecda;--paper:#faf5ea;--card:#fffdf7;--gran:#a3162f;--gran2:#c92a43;--gold:#c99a3c;--muted:#5e5a4c;--serif:"Fraunces",Georgia,serif}
@page{size:100mm 150mm;margin:0}
body{font-family:"Manrope",system-ui,sans-serif;background:#d9d2c2;min-height:100vh;display:grid;place-items:center;padding:58px 16px 24px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hint{position:fixed;top:0;left:0;right:0;height:40px;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--green);font-size:12px;font-weight:700;border-bottom:1px solid rgba(20,53,38,.18)}
.card{position:relative;width:min(100mm,calc(100vw - 44px));aspect-ratio:2/3;background:var(--card);border:1.5px solid var(--green);box-shadow:3mm 3mm 0 var(--green);display:flex;flex-direction:column;text-align:center;overflow:hidden}
.card::before{content:"";position:absolute;inset:2.4mm;border:.3mm solid rgba(20,53,38,.4);pointer-events:none;z-index:2}
.flag{display:flex;height:3.5mm;flex:none}.flag i{flex:1}.flag i:nth-child(1){background:var(--leaf)}.flag i:nth-child(2){background:var(--nogada)}.flag i:nth-child(3){background:var(--gran2)}
.top{background:var(--green);color:var(--nogada);padding:7mm 8mm 5mm}
.crown{width:13mm;height:8mm;color:var(--gold);display:block;margin:0 auto 2mm}
.over{font-size:2.6mm;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#f0d79b}
h1{font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:900;font-size:11.5mm;line-height:.88;letter-spacing:-.035em;margin-top:2mm}
.reino{font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;font-style:italic;font-weight:700;font-size:5.4mm;color:#e3bf6f;margin-top:1.2mm}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4mm;padding:4mm 9mm 7mm}
.qr{width:52mm;padding:4mm;background:#fff;border:.4mm solid var(--green)}
.qr svg{display:block;width:100%;height:auto}
.orn{display:flex;align-items:center;justify-content:center;gap:2.5mm;color:var(--gold)}
.orn::before,.orn::after{content:"";height:.4mm;width:12mm;background:currentColor}
.cta{font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:900;font-size:6.2mm;line-height:1.05;color:var(--green);letter-spacing:-.02em}
.cta em{font-style:italic;font-weight:700;color:var(--gran)}
.sub{font-size:3.3mm;font-weight:500;color:var(--muted);margin-top:-2mm}
@media print{body{background:none;padding:0;display:block}.hint{display:none}.card{box-shadow:none;width:100mm;height:150mm}}
</style>
</head>
